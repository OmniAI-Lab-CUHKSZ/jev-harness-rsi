[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-harness-rsi"
version = "0.2.2"
description = "Offline evolution of a shared Jev decision and generation harness for AppWorld"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jev-appworld = "jev_harness.cli:main"

[tool.setuptools]
packages = ["jev_harness"]
py-modules = ["formal_run", "phase1_run"]

[tool.setuptools.package-data]
jev_harness = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
